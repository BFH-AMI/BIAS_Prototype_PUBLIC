<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BIAS Prototype - Initial Screening</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css?v=20260615e" />
  </head>
  <body>
    <main>
      <nav data-workflow-nav data-active="preselection"></nav>

      <section class="hero">
        <h1>Initial Screening</h1>
        <p id="preselectionMeta">Preparing must-have requirement screening...</p>
      </section>

      <section class="card" style="margin-top: 16px">
        <h3>Must-Have Requirements</h3>
        <div id="preselectionRequirements" class="muted">Loading requirements...</div>
      </section>

      <section class="card" style="margin-top: 16px">
        <h3>Omitted Candidates</h3>
        <p class="muted">Review omissions. Click a candidate name to inspect the profile. Click x to return a candidate to the selection pool.</p>
        <div id="preselectionOmittedList" class="muted">Loading omitted candidates...</div>
        <p id="preselectionStatus" class="muted" style="margin-top:10px"></p>
      </section>

      <section class="card snapshot-actions-card" style="margin-top: 16px">
        <h3>Next Step</h3>
        <div class="snapshot-actions-row">
          <button class="btn secondary" type="button" id="runPreselectionBtn">Run Initial Screening Again</button>
          <button class="btn primary" type="button" id="continueToModelSnapshotBtn">Continue to Selection Pool</button>
        </div>
      </section>
    </main>

    <script src="/static/app.js?v=20260617a"></script>
    <script>
      window.Webtool.loadPreselectionPage();
    </script>
  </body>
</html>
